name: Deploy theme
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          # テンプレートを1枚ずつ書くと追加したときに転送し忘れる
          # （single.php を足したときに実際に忘れた）。ルートの .php は全部送る
          source: "*.php,style.css,parts/**,assets/**"
          target: "/home/liberarch/www/gouter/wp-content/themes/gouter"
