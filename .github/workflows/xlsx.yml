name: 配布ファイルの検算

# 配布するエクセルの数式を、実際にLibreOfficeで計算させて確かめる。
# クラウドのセッションではLibreOfficeが動かない（3セルのファイルでも固まる）ので、
# ここに回す。openpyxlは数式を文字列で書くだけで計算結果を持たないため、
# 一度通さないと「本当に計算できる式か」が分からない。

on:
  push:
    paths:
      - 'assets/downloads/**.xlsx'
      - 'tools/build_uriage_template.py'
      - 'tools/xlsx_check.py'
      - '.github/workflows/xlsx.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LibreOfficeとopenpyxlを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc fonts-noto-cjk
          python3 -m pip install --quiet openpyxl

      - name: 数式を計算させて確かめる
        run: python3 tools/xlsx_check.py assets/downloads/uriage-kanri-template.xlsx
